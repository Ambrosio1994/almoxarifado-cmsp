services:
  postgres:
    image: postgres:15
    container_name: almoxarifado-cmsp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ADMIN_PASSWORD:?configure LOCAL_POSTGRES_ADMIN_PASSWORD no .env}
      POSTGRES_DB: postgres
    volumes:
      - almoxarifado_postgres_data:/var/lib/postgresql/data
      - ./certs:/cert-source:ro
      - ./scripts/local-postgres-entrypoint.sh:/usr/local/bin/local-postgres-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/local-postgres-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  almoxarifado_postgres_data:
