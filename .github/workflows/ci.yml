name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/storage.js
      - run: node --check scripts/db-migrate.js
      - run: docker build -t almoxarifado-cmsp:ci .
