services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-almoxarifado-cmsp:production}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      UPLOAD_STORAGE_ROOT: /data/uploads
    volumes:
      - almoxarifado_uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-256m},noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  almoxarifado_uploads:
